<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>慶隆旅遊 AI 智慧旅遊助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --primary:#5D7F63; --primary-dark:#41594A;
    --primary-soft:#E4EDE3; --ink:#2A2A25; --ink-soft:#6E6B60; --accent:#C17A4E;
    --gold:#C9A24B; --gold-soft:#F3EAD2;
    --success:#4C7A52; --success-soft:#E4EFE1; --warn:#B98A34; --warn-soft:#F5EBD6;
    --danger:#B15A4A; --danger-soft:#F5E3DE; --border:#E4DFD1;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);}
  #app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:40px;}
  .topbar{display:flex;align-items:center;gap:10px;padding:16px 16px;background:var(--primary);color:#fff;position:sticky;top:0;z-index:10;}
  .topbar .back{background:rgba(255,255,255,.18);border:none;border-radius:14px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;color:#fff;flex-shrink:0;}
  .topbar .title{font-size:21px;font-weight:900;letter-spacing:.5px;flex:1;}
  .topbar .calc-trigger{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:rgba(255,255,255,.55);font-size:16px;cursor:pointer;flex-shrink:0;}
  .hero{background:linear-gradient(160deg,var(--primary),var(--primary-dark));color:#fff;padding:30px 20px 36px;border-radius:0 0 32px 32px;position:relative;overflow:hidden;}
  .hero .brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:900;}
  .hero .sub{font-size:15px;opacity:.9;margin-top:6px;}
  .hero .calc-trigger{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:rgba(255,255,255,.4);font-size:15px;cursor:pointer;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:22px 18px;}
  .bigbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:24px 10px;border-radius:22px;border:2px solid var(--border);background:#fff;color:var(--ink);cursor:pointer;min-height:122px;font-size:18px;font-weight:700;box-shadow:0 2px 6px rgba(93,127,99,.08);}
  .bigbtn .ic{font-size:32px;}
  .content{padding:16px 18px 100px;}
  .field{margin-bottom:20px;}
  .field label{display:block;font-size:18px;font-weight:700;margin-bottom:6px;}
  .field .hint{font-size:14px;color:var(--ink-soft);margin-bottom:8px;}
  input[type=text], input[type=date], input[type=time], input[type=tel], input[type=number], textarea, select{
    width:100%;font-size:18px;padding:13px 15px;border-radius:14px;border:2px solid var(--border);background:#fff;color:var(--ink);
  }
  textarea{min-height:70px;resize:vertical;font-family:inherit;}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:700;border-radius:16px;padding:15px 18px;cursor:pointer;width:100%;border:none;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-gold{background:var(--gold);color:#fff;}
  .btn-ghost{background:#fff;color:var(--primary);border:2px solid var(--primary);}
  .btn-danger{background:var(--danger-soft);color:var(--danger);border:2px solid var(--danger);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-sm{padding:9px 12px;font-size:14px;border-radius:12px;width:auto;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  .choice{padding:14px 8px;border-radius:14px;font-size:17px;font-weight:700;border:2px solid var(--border);background:#fff;cursor:pointer;text-align:center;}
  .choice.sel{border-color:var(--primary);background:var(--primary-soft);}
  .pill{padding:9px 15px;border-radius:999px;font-size:15px;font-weight:700;border:2px solid var(--border);background:#fff;cursor:pointer;}
  .pill.sel{border-color:var(--primary);background:var(--primary-soft);}
  .card{background:#fff;border:2px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.03);}
  .empty{text-align:center;color:var(--ink-soft);font-size:16px;padding:40px 10px;line-height:1.8;}
  .bottombar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:14px 16px;display:flex;gap:10px;max-width:520px;margin:0 auto;z-index:15;}
  .status-pill{border:none;font-weight:800;font-size:15px;border-radius:999px;padding:8px 14px;cursor:pointer;}
  .stat-chip{flex:1;background:#fff;border:2px solid var(--border);border-radius:14px;padding:10px 4px;text-align:center;}
  .stat-chip .v{font-size:20px;font-weight:900;}
  .stat-chip .l{font-size:12px;color:var(--ink-soft);}
  .home-fab{position:fixed;bottom:20px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--primary-dark);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:20;font-size:22px;color:#fff;}
  .info-card{background:#fff;border:2px solid var(--border);border-radius:16px;padding:13px;}
  .info-card .t{font-weight:700;font-size:15px;margin-bottom:5px;}
  .info-card .d{font-size:14px;color:var(--ink-soft);line-height:1.6;}
  .banner{background:var(--danger-soft);color:var(--danger);padding:14px;border-radius:14px;font-size:15px;margin-top:8px;margin-bottom:16px;}
  .notice-box{background:var(--primary-soft);border-radius:16px;padding:16px;font-size:15px;line-height:1.9;white-space:pre-wrap;}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  #print-area{position:relative;}
  .print-content{position:relative;z-index:1;}
  .corner-logo{position:absolute;bottom:6px;right:6px;width:86px;z-index:2;filter:drop-shadow(0 2px 5px rgba(0,0,0,.25));pointer-events:none;}
  .doc-stamp{display:flex;justify-content:center;margin:14px 0 4px;}
  .doc-stamp img{width:110px;}
  .card-logo{width:64px;display:block;margin:0 auto 10px;}
  .tel-link{color:var(--primary);font-weight:800;text-decoration:none;border-bottom:1px dashed var(--primary);}
  .day-header{font-family:'Noto Serif TC',serif;font-weight:900;font-size:20px;color:#fff;background:linear-gradient(120deg,var(--primary-dark),var(--primary));padding:12px 18px;border-radius:14px;margin:20px 0 12px;display:flex;justify-content:space-between;align-items:center;}
  .day-header .date{font-size:13px;font-weight:500;opacity:.85;}
  .block-line{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--border);}
  .block-line:last-child{border-bottom:none;}
  .block-ic{font-size:20px;flex-shrink:0;width:26px;text-align:center;}
  .block-body .k{font-size:13px;color:var(--ink-soft);font-weight:700;}
  .block-body .v{font-size:16px;font-weight:700;margin-top:1px;}
  .block-body .d{font-size:14px;color:var(--ink-soft);margin-top:3px;line-height:1.7;}
  .nav-link{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--primary);text-decoration:none;margin-top:4px;font-weight:700;}
  .weather-chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:13px;margin-left:8px;}
  .day-editor{background:#fff;border:2px solid var(--border);border-radius:20px;padding:14px;margin-bottom:16px;}
  .day-editor .dtitle{font-weight:900;font-size:18px;color:var(--primary-dark);margin-bottom:10px;}
  .qadd{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
  .qadd button{background:var(--primary-soft);border:none;border-radius:12px;padding:9px 12px;font-size:14px;font-weight:700;color:var(--primary-dark);cursor:pointer;}
  .block-edit{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px;}
  .block-edit .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .block-edit .head .ic{font-weight:700;font-size:15px;}
  .block-edit .del{border:none;background:none;color:var(--danger);font-size:16px;cursor:pointer;}
  .block-edit input, .block-edit textarea{margin-bottom:6px;font-size:15px;padding:10px 12px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .calc-box{background:#fff;border-radius:24px;padding:18px;width:100%;max-width:320px;}
  .calc-display{background:var(--ink);color:#fff;font-size:34px;font-weight:700;text-align:right;padding:18px 16px;border-radius:14px;margin-bottom:12px;min-height:34px;word-break:break-all;}
  .calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .calc-grid button{padding:18px 0;font-size:20px;font-weight:700;border-radius:14px;border:none;background:var(--primary-soft);color:var(--ink);cursor:pointer;}
  .calc-grid button.op{background:var(--primary);color:#fff;}
  .calc-grid button.eq{background:var(--accent);color:#fff;}
  .calc-grid button.clear{background:var(--danger-soft);color:var(--danger);}
  .calc-close{width:100%;margin-top:12px;background:none;border:none;color:var(--ink-soft);font-size:15px;padding:8px;cursor:pointer;}
  table.fin-table{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed;}
  table.fin-table th, table.fin-table td{border:1px solid var(--border);padding:9px 6px;text-align:left;vertical-align:top;word-break:break-word;}
  table.fin-table th{color:var(--ink-soft);font-weight:700;font-size:12px;background:var(--primary-soft);}
  table.fin-table col.c-date{width:22%;}
  table.fin-table col.c-label{width:42%;}
  table.fin-table col.c-amount{width:24%;}
  table.fin-table col.c-del{width:12%;}
  table.fin-table td.amount{text-align:right;}
  table.fin-table td.del{text-align:center;}
  @media print{
    .no-print, .topbar, .bottombar, .home-fab, .modal-overlay{display:none !important;}
    body.print-plain-mode #app{display:none !important;}
    body{background:#fff;}
    .print-only{display:inline !important;}
  }
  .print-only{display:none;}
</style>
</head>

<div id="app"></div>
<div id="plain-print-host"></div>

<script>
/* ============================================================
   資料儲存：瀏覽器 localStorage（部署在 GitHub Pages 或直接開啟都能用）
   ============================================================ */
const STORE_KEY = "qlta_data_v2";
function loadDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    trips: [], customers: [], drivers: [], works: [], ledger: [],
    settings: { companyName: "慶隆旅遊", phone: "", address: "" }
  };
}
function saveDB(){ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
let DB = loadDB();
if(!DB.ledger) DB.ledger = [];
if(DB.settings.clickSound === undefined) DB.settings.clickSound = true;

/* 按鍵音效（不需外部音檔，用瀏覽器內建音源產生） */
let audioCtx = null;
function playClick(){
  if(!DB.settings.clickSound) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(760, now);
    gain.gain.setValueAtTime(0.09, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now+0.09);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now+0.1);
  }catch(e){}
}
document.addEventListener("click", function(e){
  if(e.target.closest("button, .bigbtn, .pill, .choice, .status-pill")) playClick();
}, true);

function fmtDateNice(dateStr){
  if(!dateStr) return "";
  const d = new Date(dateStr+"T00:00:00");
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
}

function pickOne(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function autoDesc(kind, place, features){
  const mood = features.map(f=>MOODS[f]).filter(Boolean)[0];
  switch(kind){
    case "spot": return `${pickOne(SPOT_TEMPLATES)}${mood?"，"+mood:""}。`;
    case "hotel": return pickOne(HOTEL_LINES)+"。";
    case "return": return pickOne(RETURN_LINES)+"。";

    case "lunch": return pickOne(LUNCH_LINES)+"。";
    case "dinner": return pickOne(DINNER_LINES)+"。";
    default: return "";
  }
}

/* 組成純文字版本（可複製貼到 LINE） */
function buildPlainText(trip, content){
  let out = `${content.title}\n`;
  if(content.subtitle) out += `${content.subtitle}\n`;
  out += `\n${content.intro}\n`;
  if(trip.pricePerPerson) out += `\n💰 每人費用：${trip.pricePerPerson}\n`;
  trip.days.forEach((day, i)=>{
    const dateStr = trip.startDate ? fmtDateNice(addDays(trip.startDate, i)) : "";
    out += `\n⸻\n【第${numToChar(i+1)}天】${dateStr?"（"+dateStr+"）":""}\n`;
    day.blocks.forEach(b=>{
      const m = KIND_META[b.kind];
      if(b.kind==="meet"){
        out += `集合地點：${b.place||"未填寫"}\n時間：${b.time||"未填寫"}\n`;
      } else if(b.kind==="breakfast"){
        out += `早餐時間：${b.time||"未填寫"}${b.place?"（"+b.place+"）":""}\n`;
      } else if(b.kind==="lunch"){
        out += `中餐：${b.place||"未填寫"}${b.desc?"　"+b.desc:""}\n`;
      } else if(b.kind==="dinner"){
        out += `晚餐：${b.place||"未填寫"}${b.desc?"　"+b.desc:""}\n`;
      } else if(b.kind==="hotel"){
        out += `入住：${b.place||"未填寫"}\n${b.desc||autoDesc("hotel",b.place,trip.features)}\n進入夢鄉💤\n`;
      } else if(b.kind==="return"){
        out += `賦歸時間：${b.time||"未填寫"}\n${b.desc||autoDesc("return",b.place,trip.features)}\n`;
      } else if(b.kind==="spot"){
        out += `▸ ${b.place||"景點"}${b.time?"（"+b.time+"）":""}\n${b.desc||autoDesc("spot",b.place,trip.features)}\n`;
      } else {
        out += `${b.place?b.place+"：":""}${b.desc||""}\n`;
      }
    });
  });
  out += `\n⸻\n`;
  if(trip.meetPlace) out += `出發集合：${trip.meetPlace} ${trip.meetTime||""}\n`;
  return out;
}
function numToChar(n){
  const chars=["一","二","三","四","五","六","七","八","九","十","十一","十二","十三","十四","十五"];
  return chars[n-1] || n;
}

/* ============================================================
   天氣預報（Open-Meteo，免金鑰）
   ============================================================ */
const weatherCodeMap = {
  0:"☀️ 晴朗",1:"🌤️ 晴時多雲",2:"⛅ 多雲",3:"☁️ 陰天",
  45:"🌫️ 有霧",48:"🌫️ 霧淞",
  51:"🌦️ 毛毛雨",53:"🌦️ 毛毛雨",55:"🌧️ 毛毛雨",
  61:"🌧️ 小雨",63:"🌧️ 中雨",65:"🌧️ 大雨",
  71:"🌨️ 小雪",73:"🌨️ 中雪",75:"❄️ 大雪",
  80:"🌦️ 短暫陣雨",81:"🌧️ 陣雨",82:"⛈️ 強陣雨",
  95:"⛈️ 雷雨",96:"⛈️ 雷雨伴冰雹",99:"⛈️ 強烈雷雨"
};
async function fetchWeatherFor(place, dates){
  try{
    const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(place)}&count=1&language=zh&format=json`).then(r=>r.json());
    if(!geo.results || !geo.results.length) return null;
    const {latitude, longitude} = geo.results[0];
    const fc = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTaipei&forecast_days=16`).then(r=>r.json());
    if(!fc.daily) return null;
    const out = {};
    fc.daily.time.forEach((d,i)=>{
      out[d] = {
        code: fc.daily.weathercode[i],
        max: Math.round(fc.daily.temperature_2m_max[i]),
        min: Math.round(fc.daily.temperature_2m_min[i]),
      };
    });
    return out;
  }catch(e){ return null; }
}

  return `

      <button onclick="addBlock(${i},'dinner')">🍽️ 晚餐</button>
      ${!isLast ? `<button onclick="addBlock(${i},'hotel')">🏨 住宿</button>`:""}
      ${isLast ? `<button onclick="addBlock(${i},'return')">🚌 賦歸</button>`:""}

    </div>
  </div>`;
}
function renderBlockEdit(b, dayIdx, blockIdx){
  const m = KIND_META[b.kind];
  const needsTime = ["meet","breakfast","spot","return"].includes(b.kind);
  const placeLabel = {meet:"集合地點", breakfast:"早餐地點（可留空）", spot:"景點名稱", lunch:"午餐地點／內容",
    dinner:"晚餐地點／內容", hotel:"飯店名稱", return:"備註（可留空）", note:"標題"}[b.kind];
  const timeLabel = {meet:"時間", breakfast:"時間（例：07:00~09:00）", spot:"時間（可留空）", return:"賦歸時間"}[b.kind];
  return `
  <div class="block-edit">
    <div class="head"><div class="ic">${m.icon} ${m.label}</div><button class="del" onclick="removeBlock(${dayIdx},${blockIdx})">✕ 刪除</button></div>
    ${needsTime ? `<input type="text" placeholder="${timeLabel}" value="${esc(b.time)}" oninput="updateBlock(${dayIdx},${blockIdx},'time',this.value)">` : ""}
    ${b.kind!=="return" ? `<input type="text" placeholder="${placeLabel}" value="${esc(b.place)}" oninput="updateBlock(${dayIdx},${blockIdx},'place',this.value)">` : ""}
    <textarea placeholder="內容說明（可留空，AI 會自動幫您寫）" oninput="updateBlock(${dayIdx},${blockIdx},'desc',this.value)">${esc(b.desc)}</textarea>
  </div>`;
}
function renderWizardOnly(){
  document.getElementById("days-editor").innerHTML = renderDaysEditor();
}
function setDayCount(n){
  n = Math.max(1, Math.min(15, n||1));
  const cur = wizardTrip.days.length;
  if(n>cur){
    for(let i=cur;i<n;i++) wizardTrip.days.push(newDay(i>0?"breakfast":"meet"));
  } else if(n<cur){
    wizardTrip.days = wizardTrip.days.slice(0,n);
  }
  render();
}
function toggleFeature(o){
  wizardTrip.features = wizardTrip.features.includes(o) ? wizardTrip.features.filter(x=>x!==o) : [...wizardTrip.features,o];
  render();
}
function addBlock(dayIdx, kind){
  wizardTrip.days[dayIdx].blocks.push(newBlock(kind));
  renderWizardOnly();
}
function removeBlock(dayIdx, blockIdx){
  wizardTrip.days[dayIdx].blocks.splice(blockIdx,1);
  renderWizardOnly();
}
function updateBlock(dayIdx, blockIdx, field, val){
  wizardTrip.days[dayIdx].blocks[blockIdx][field] = val;
}

async function wizardGenerate(){
  const t = wizardTrip;
  if(!t.title){
    const errEl = document.getElementById("wizard-error");
    errEl.style.display="block"; errEl.innerText="請至少輸入旅遊名稱喔！";
    return;
  }
  // 補上頂層集合資訊（取自第一天的 meet block，方便舊畫面顯示）
  const firstMeet = t.days[0].blocks.find(b=>b.kind==="meet");
  if(firstMeet){ t.meetPlace = firstMeet.place; t.meetTime = firstMeet.time; }

  const content = {
    title: t.title,
    subtitle: t.features.map(f=>MOODS[f]).filter(Boolean)[0] || "輕鬆出遊，好山好水好心情",
    intro: `${pickOne(OPENERS)}展開一趟${t.days.length}天的旅程。${t.features.map(f=>MOODS[f]).filter(Boolean).join("，")||"行程安排輕鬆順暢，適合各年齡層一同參加"}。`,
  };
  const plain = buildPlainText(t, content);

  const tripId = uid();
  const trip = { id: tripId, title: t.title, startDate: t.startDate, features:[...t.features],
    pricePerPerson: t.pricePerPerson, meetPlace: t.meetPlace, meetTime: t.meetTime,
    days: JSON.parse(JSON.stringify(t.days)), driverId:"", vehiclePlate:"", tourists:[] };
  const work = { id: uid(), tripId, createdAt: new Date().toISOString(), content, plainText: plain, weather: null };
  DB.trips.push(trip); DB.works.push(work); saveDB();
  wizardTrip = null;
  go("work-detail", work.id);
  // 背景抓天氣（不阻塞畫面）
  const wPlace = trip.meetPlace || trip.title;
  fetchWeatherFor(wPlace, []).then(w=>{
    if(w){
      const work2 = DB.works.find(x=>x.id===work.id);
      if(work2){ work2.weather = w; saveDB(); if(screen==="work-detail" && param===work.id) render(); }
    }
  });
}

async function exportPDF(workId){
  const btn = document.getElementById("pdf-btn");
  const old = btn.innerText; btn.innerText="產生中，請稍候…"; btn.disabled=true;
  try{
    const el = document.getElementById("print-area");
    const canvas = await html2canvas(el, {scale:2, backgroundColor:"#ffffff", useCORS:true});
    const imgData = canvas.toDataURL("image/png");
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p","mm","a4");
    const pageWidth = 210, pageHeight = 297;
    const imgWidth = pageWidth;
    const imgHeight = canvas.height * imgWidth / canvas.width;
    let heightLeft = imgHeight, position = 0;
    pdf.addImage(imgData,"PNG",0,position,imgWidth,imgHeight);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData,"PNG",0,position,imgWidth,imgHeight);
      heightLeft -= pageHeight;
    }
    const w = DB.works.find(x=>x.id===workId);
    pdf.save(`${w.content.title||"旅遊行程"}.pdf`);
  }catch(e){
    alert("PDF 產生失敗，請確認網路連線後再試一次（PDF功能需要網路載入必要元件）。");
  }
  btn.innerText = old; btn.disabled=false;
}

function buildManifestText(t){
  const d = DB.drivers.find(x=>x.id===t.driverId);
  const s = DB.settings;
  let out = `【司機出車總行程單】\n公司：${s.companyName||"慶隆旅遊"}\n團名：${t.title}\n司機：${d?d.name:"未指派"}${d&&d.phone?"（"+d.phone+"）":""}\n車牌：${t.vehiclePlate||"未填寫"}\n日期：${fmtDateNice(t.startDate)||"未定"}（${tripDayLabel(t)}）\n\n`;
  t.days.forEach((day,i)=>{
    const dateStr = t.startDate ? fmtDateNice(addDays(t.startDate,i)) : "";
    out += `【第${numToChar(i+1)}天】${dateStr}\n`;
    day.blocks.forEach(b=>{
      const m = KIND_META[b.kind];
      let line = "";
      if(b.kind==="meet") line = `集合：${b.place||"未填寫"} ${b.time||""}`;
      else if(b.kind==="breakfast") line = `早餐：${b.time||""} ${b.place||""}`;
      else if(b.kind==="lunch") line = `午餐：${b.place||"未填寫"}`;
      else if(b.kind==="dinner") line = `晚餐：${b.place||"未填寫"}`;
      else if(b.kind==="hotel") line = `住宿：${b.place||"未填寫"}`;
      else if(b.kind==="return") line = `賦歸：${b.time||"未填寫"}`;
      else if(b.kind==="spot") line = `景點：${b.place||"未填寫"} ${b.time||""}`;
      else line = `${b.place||""} ${b.desc||""}`;
      out += `☐ ${m.icon} ${line}\n`;
    });
    out += `\n`;
  });
  out += `【旅客名單】共 ${t.tourists.length} 人\n`;
  t.tourists.forEach(p=>{ out += `☐ ${p.name}\n`; });
  out += `\n完成後請勾選確認，並回報老闆，辛苦了！`;
  return out;
}

/* 收支表專用的小計算機，不佔滿整個畫面，方便老闆邊算邊填 */
let miniCalcState = { cur:"0", prev:null, op:null, reset:false };
function toggleMiniCalc(){
  const wrap = document.getElementById("mini-calc-wrap");
  if(wrap.innerHTML){ wrap.innerHTML=""; return; }
  miniCalcState = { cur:"0", prev:null, op:null, reset:false };
  wrap.innerHTML = `
    <div style="background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:10px;margin-top:8px;">
      <div style="background:var(--ink);color:#fff;font-size:22px;font-weight:700;text-align:right;padding:10px 12px;border-radius:10px;margin-bottom:8px;" id="mini-calc-display">0</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;">
        <button type="button" onclick="miniCalcClear()" style="padding:10px 0;border:none;border-radius:10px;background:var(--danger-soft);color:var(--danger);font-weight:700;">C</button>
        <button type="button" onclick="miniCalcOp('÷')" style="padding:10px 0;border:none;border-radius:10px;background:var(--primary);color:#fff;font-weight:700;">÷</button>
        <button type="button" onclick="miniCalcOp('×')" style="padding:10px 0;border:none;border-radius:10px;background:var(--primary);color:#fff;font-weight:700;">×</button>
        <button type="button" onclick="miniCalcOp('-')" style="padding:10px 0;border:none;border-radius:10px;background:var(--primary);color:#fff;font-weight:700;">-</button>
        ${[7,8,9].map(n=>`<button type="button" onclick="miniCalcDigit('${n}')" style="padding:10px 0;border:none;border-radius:10px;background:var(--primary-soft);font-weight:700;">${n}</button>`).join("")}
        <button type="button" onclick="miniCalcOp('+')" style="padding:10px 0;border:none;border-radius:10px;background:var(--primary);color:#fff;font-weight:700;grid-row:span 2;">+</button>
        ${[4,5,6].map(n=>`<button type="button" onclick="miniCalcDigit('${n}')" style="padding:10px 0;border:none;border-radius:10px;background:var(--primary-soft);font-weight:700;">${n}</button>`).join("")}
        ${[1,2,3].map(n=>`<button type="button" onclick="miniCalcDigit('${n}')" style="padding:10px 0;border:none;border-radius:10px;background:var(--primary-soft);font-weight:700;">${n}</button>`).join("")}
        <button type="button" onclick="miniCalcEq()" style="padding:10px 0;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;grid-row:span 2;">＝</button>
        <button type="button" onclick="miniCalcDigit('0')" style="padding:10px 0;border:none;border-radius:10px;background:var(--primary-soft);font-weight:700;grid-column:span 2;">0</button>
        <button type="button" onclick="miniCalcDigit('.')" style="padding:10px 0;border:none;border-radius:10px;background:var(--primary-soft);font-weight:700;">.</button>
      </div>
      <button type="button" class="btn btn-primary btn-sm" style="width:100%;margin-top:8px;" onclick="useMiniCalcResult()">使用這個金額</button>
    </div>`;
}
function miniCalcRefresh(){ const d=document.getElementById("mini-calc-display"); if(d) d.innerText = miniCalcState.cur; }
function miniCalcDigit(d){
  if(miniCalcState.reset){ miniCalcState.cur="0"; miniCalcState.reset=false; }
  if(d==="." && miniCalcState.cur.includes(".")) return;
  miniCalcState.cur = miniCalcState.cur==="0" && d!=="." ? d : miniCalcState.cur+d;
  miniCalcRefresh();
}
function miniCalcClear(){ miniCalcState = { cur:"0", prev:null, op:null, reset:false }; miniCalcRefresh(); }
function miniCalcOp(op){
  if(miniCalcState.prev!==null && !miniCalcState.reset) miniCalcEq();
  miniCalcState.prev = parseFloat(miniCalcState.cur); miniCalcState.op = op; miniCalcState.reset = true;
}
function miniCalcEq(){
  if(miniCalcState.op===null || miniCalcState.prev===null) return;
  const a=miniCalcState.prev, b=parseFloat(miniCalcState.cur); let r=0;
  switch(miniCalcState.op){
    case "+": r=a+b; break; case "-": r=a-b; break;
    case "×": r=a*b; break; case "÷": r=b===0?NaN:a/b; break;
  }
  miniCalcState.cur = isNaN(r) ? "錯誤" : String(Math.round(r*100)/100);
  miniCalcState.prev=null; miniCalcState.op=null; miniCalcState.reset=true; miniCalcRefresh();
}
function useMiniCalcResult(){
  const amountEl = document.getElementById("l-amount");
  if(amountEl) amountEl.value = miniCalcState.cur;
  document.getElementById("mini-calc-wrap").innerHTML = "";
}
function exportLedgerCSV(){
  let csv = "日期,類型,項目,金額,關聯行程\n";
  DB.ledger.forEach(e=>{
    const trip = DB.trips.find(t=>t.id===e.tripId);
    csv += `${e.date||""},${e.type==='income'?'收入':'支出'},${e.label},${e.amount},${trip?trip.title:""}\n`;
  });
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=`收支報表_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
}

      <div class="calc-grid">
        <button class="clear" onclick="calcClear()">C</button>
        <button onclick="calcBack()">⌫</button>
        <button class="op" onclick="calcOp('%')">%</button>
        <button class="op" onclick="calcOp('÷')">÷</button>
        <button onclick="calcDigit('7')">7</button><button onclick="calcDigit('8')">8</button><button onclick="calcDigit('9')">9</button>
        <button class="op" onclick="calcOp('×')">×</button>
        <button onclick="calcDigit('4')">4</button><button onclick="calcDigit('5')">5</button><button onclick="calcDigit('6')">6</button>
        <button class="op" onclick="calcOp('-')">-</button>
        <button onclick="calcDigit('1')">1</button><button onclick="calcDigit('2')">2</button><button onclick="calcDigit('3')">3</button>
        <button class="op" onclick="calcOp('+')">+</button>
        <button onclick="calcDigit('0')" style="grid-column:span 2;">0</button>
        <button onclick="calcDigit('.')">.</button>
        <button class="eq" onclick="calcEquals()">=</button>
      </div>
      <button class="calc-close" onclick="closeCalc()">關閉</button>
    </div>`;
  overlay.onclick = (e)=>{ if(e.target===overlay) closeCalc(); };
  document.body.appendChild(overlay);
}
function closeCalc(){ const o=document.getElementById("calc-overlay"); if(o) o.remove(); }
function calcRefresh(){ document.getElementById("calc-display").innerText = calcState.cur; }
function calcDigit(d){
  if(calcState.reset){ calcState.cur = "0"; calcState.reset=false; }
  if(d==="." && calcState.cur.includes(".")) return;
  calcState.cur = calcState.cur==="0" && d!=="." ? d : calcState.cur + d;
  calcRefresh();
}
function calcClear(){ calcState = { cur:"0", prev:null, op:null, reset:false }; calcRefresh(); }
function calcBack(){ calcState.cur = calcState.cur.length>1 ? calcState.cur.slice(0,-1) : "0"; calcRefresh(); }
function calcOp(op){
  if(calcState.prev!==null && !calcState.reset) calcEquals();
  calcState.prev = parseFloat(calcState.cur);
  calcState.op = op;
  calcState.reset = true;
}
function calcEquals(){
  if(calcState.op===null || calcState.prev===null) return;
  const a = calcState.prev, b = parseFloat(calcState.cur);
  let r = 0;
  switch(calcState.op){
    case "+": r = a+b; break;
    case "-": r = a-b; break;
    case "×": r = a*b; break;
    case "÷": r = b===0 ? NaN : a/b; break;
    case "%": r = a*(b/100); break;
  }
  calcState.cur = isNaN(r) ? "錯誤" : String(Math.round(r*10000)/10000);
  calcState.prev = null; calcState.op = null; calcState.reset = true;
  calcRefresh();
}

/* ============================================================
   共用：topbar
   ============================================================ */
function topbar(title, backTo){
  return `<div class="topbar">
    ${backTo ? `<button class="back" onclick="go('${backTo}')">←</button>` : ""}
    <div class="title">${esc(title)}</div>
    <button class="calc-trigger" onclick="openCalc()">🧮</button>
  </div>`;
}

/* ============================================================
   畫面渲染主流程
   ============================================================ */
function renderScreen(){
  switch(screen){
    case "home": return screenHome();
    case "wizard": return screenWizard();
    case "work-detail": return screenWorkDetail(param);
    case "works": return screenWorks();
    case "trips": return screenTrips();
    case "trip-detail": return screenTripDetail(param);
    case "rollcall-pick": return screenRollcallPick();
    case "rollcall": return screenRollcall(param);
    case "customers": return screenCustomers();
    case "drivers": return screenDrivers();
    case "finance": return screenFinance(param);
    case "settings": return screenSettings();
    default: return screenHome();
  }
}
function render(){
  const app = document.getElementById("app");
  app.innerHTML = renderScreen();
  bindEvents();
}
function bindEvents(){
  const app = document.getElementById("app");
  const old = document.getElementById("home-fab-el");
  if(old) old.remove();
  if(screen !== "home"){
    const btn = document.createElement("button");
    btn.id = "home-fab-el"; btn.className = "home-fab";
    btn.innerText = "🏠"; btn.onclick = ()=>go("home");
    app.appendChild(btn);
  }
}

render();
</script>
